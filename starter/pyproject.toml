description = "Upwork API Support Bot — starter template"
requires-python = ">=3.11"
dependencies = [
    "langchain>=0.3.0",
    "langchain-community>=0.3.0",
    "langchain-huggingface>=0.1.0",
    "langchain-chroma>=0.1.4",
    "langchain-text-splitters>=0.3.0",
    "chromadb>=0.5.0",
    "sentence-transformers>=3.0.0",
    "pdfplumber>=0.11.0",
    "groq>=0.9.0",
    "python-dotenv>=1.0.0",
    "streamlit>=1.36.0",
    "pytesseract>=0.3.13",
    "pdf2image>=1.17.0",
    "pymupdf>=1.28.2",
]

[tool.uv]
package = false
